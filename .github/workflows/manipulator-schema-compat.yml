name: Manipulator schema compatibility

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-compat:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run schema-break negative test
        run: |
          python3 -m unittest discover \
            -s intrinsic/tools/manipulator_schema_compat \
            -p 'schema_break_negative_test.py' -v

      - name: Run schema compatibility unit tests
        run: |
          python3 -m unittest discover \
            -s intrinsic/tools/manipulator_schema_compat \
            -p '*_test.py' -v

      - name: Check protected schema inventory
        run: |
          python3 intrinsic/tools/manipulator_schema_baseline/extract_public_schema_inventory.py --self-check
          python3 intrinsic/tools/manipulator_schema_compat/compare_schema_inventory.py \
            intrinsic/tools/manipulator_schema_baseline/manipulator_public_schema_inventory.json
