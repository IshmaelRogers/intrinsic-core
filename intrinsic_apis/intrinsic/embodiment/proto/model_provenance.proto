syntax = "proto3";

package intrinsic_proto.embodiment;

option go_package = "intrinsic/embodiment/proto/model_provenance_go_proto";

// Which model produced an intent. Common provenance from PDR §15.
//
// Unset on the parent is absent. A present message is a judgment that a
// model produced the payload, even when `model_version` or `digest` is
// empty. This message is not an inference envelope, not an actuator
// command, and not a robot type.
//
// Append fields. Reserve removed tags and names. See README.md.
message ModelProvenance {
  // Stable model name. Host checks reject an empty id when this message
  // is present. Not a frame and not an embodiment enum.
  string model_id = 1;

  // Producer version string. Empty means the producer did not supply one.
  string model_version = 2;

  // Content digest of the model artifact. Empty means not supplied.
  // Absence of this message is not an empty digest.
  string digest = 3;
}
