syntax = "proto3";

package intrinsic_proto.embodiment;

option go_package = "intrinsic/embodiment/proto/capability_descriptor_go_proto";

// One capability a resource provides.
//
// `id` is a stable string. Well-known category ids are documented in
// README.md. Unknown ids stay on the wire so older clients can ignore them.
// This message has no robot-type field.
//
// Append fields. Reserve removed tags and names.
message CapabilityDeclaration {
  // Stable capability id. An empty id is rejected by host helpers.
  string id = 1;

  // Interface business logic requests, when the advertisement is more
  // specific than `id`. Empty means `id` is the requested interface.
  // The same `id` with two different `interface_id` values conflicts.
  // This string does not define the named interface.
  string interface_id = 2;
}

// Embodiment capability descriptor for one resource.
//
// An embodiment descriptor states what a resource provides. Business logic
// requests interfaces. There is no platform-wide embodiment enum. An empty
// descriptor serializes to zero bytes and advertises nothing, which is the
// prior manipulator behavior.
//
// Host helpers reject duplicate and conflicting declarations. They accept
// unknown capability ids. See README.md.
message CapabilityDescriptor {
  // Opaque name of the resource that owns `capabilities`. Helpers do not
  // branch on this string. It is not a robot class.
  string resource_id = 1;

  // Provided capabilities, in declaration order.
  repeated CapabilityDeclaration capabilities = 2;
}
