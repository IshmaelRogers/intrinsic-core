syntax = "proto3";

package intrinsic_proto.episode;

import "intrinsic/embodiment/proto/model_provenance.proto";
import "intrinsic/embodiment/proto/stamped_header.proto";
import "intrinsic/inference/proto/inference_envelope.proto";
import "intrinsic/safety/proto/safety_decision.proto";
import "intrinsic/vehicle/proto/vehicle_trajectory.proto";

option go_package = "intrinsic/episode/proto/episode_event_go_proto";

// Episode-level metadata. v1 carries the realized-parameter text only.
//
// Every tag, type, and name is permanent. Append fields only. See README.md.
message EpisodeMetadata {
  // Exact FormatMarineMetadata output (ASCII,
  // "marine_randomization_metadata_v1\n..."). Empty means no randomization
  // was recorded.
  string marine_randomization_metadata = 1;
}

// Writer-emitted record of contiguous dropped events. See README.md.
// Every tag, type, and name is permanent. Append fields only.
message EpisodeLoss {
  enum LossReason {
    LOSS_REASON_UNSPECIFIED = 0;
    LOSS_REASON_OVERFLOW = 1;   // Append saw no room (D2).
    LOSS_REASON_TOO_LARGE = 2;  // Serialized size > max_event_bytes.
  }
  uint64 dropped_count = 1;               // == last - first + 1
  uint64 first_dropped_writer_index = 2;  // inclusive
  uint64 last_dropped_writer_index = 3;   // inclusive
  LossReason reason = 4;
}

// Append-only envelope for one recorded episode event. The payload oneof case
// is the payload type. There is no separate type enum.
//
// Every tag, type, and name is permanent. Append fields only. See README.md.
// episode_event_schema_freeze_test guards this file.
message EpisodeEvent {
  // Sequence, source and receive time, source_id, frame_id, clock_domain,
  // and validity.
  intrinsic_proto.embodiment.StampedHeader header = 1;

  // Writers set 1. Newer versions are additive and accepted by v1 readers.
  uint32 schema_version = 2;

  // Empty, or exactly 64 lowercase hex characters (world snapshot digest).
  string snapshot_id = 3;

  // Empty, or lowercase hex SHA-256 over exactly the bytes of
  // EpisodeMetadata.marine_randomization_metadata. See README.md.
  string config_digest = 4;

  // Unset when not applicable.
  intrinsic_proto.embodiment.ModelProvenance provenance = 5;

  oneof payload {
    intrinsic_proto.safety.SafetyDecision safety_decision = 10;
    intrinsic_proto.vehicle.VehicleTrajectory vehicle_trajectory = 11;
    intrinsic_proto.inference.InferenceEnvelope inference_envelope = 12;
    intrinsic_proto.inference.InferenceResult inference_result = 13;
    EpisodeMetadata episode_metadata = 14;
    EpisodeLoss episode_loss = 15;
  }
}
