syntax = "proto3";

package intrinsic_proto.world;

import "intrinsic/math/proto/vector3.proto";
import "intrinsic/world/proto/marine_component_validity.proto";

option go_package = "intrinsic/world/proto/current_field_component_go_proto";

// Spatially uniform linear current for one additive World component.
//
// `velocity_m_s` is meters per second in `frame_id`. `frame_id` is exactly
// `world_enu`, `world_ned`, or `body`, matching vehicle Environment
// `current_frame_id`. This message does not convert those frames.
//
// Angular current is zero by convention. There is no angular field, shear
// map, or grid.
//
// Host checks live in intrinsic/world/current_field_component. See README.md
// there.
//
// An empty message serializes to zero bytes. Callers that never set this
// message keep the previous World wire image.
//
// Next tag: 4
message CurrentFieldComponent {
  // Required when this component is present for validation. Reuses
  // MarineComponentValidity. Host code does not fork its unknown or expired
  // rules.
  MarineComponentValidity validity = 1;

  // Exactly `world_enu`, `world_ned`, or `body`. Empty and any other id are
  // rejected. This message does not convert among those frames.
  string frame_id = 2;

  // Linear fluid current in meters per second, expressed in `frame_id`.
  // Required when the component is present. Every component must be finite.
  // Angular current is zero by convention and is not stored.
  intrinsic_proto.Vector3 velocity_m_s = 3;
}
