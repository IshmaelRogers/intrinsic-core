syntax = "proto3";

package intrinsic_proto.world;

import "intrinsic/world/proto/marine_component_validity.proto";

option go_package = "intrinsic/world/proto/bathymetry_reference_component_go_proto";

// Referenced bathymetry for one additive World component.
//
// The payload is an opaque asset reference. This message does not carry an
// inline height grid, mesh, or occupancy sample. It does not convert between
// ENU and NED, and it does not allocate a snapshot id.
//
// `frame_id` is exactly `world_enu` or `world_ned`.
// `world_enu`: +Z up. `world_ned`: +Z down.
// `vertical_bias_m` is meters along that frame's +Z. A positive value moves
// the referenced surface toward +Z. Unset means absent, not zero.
//
// Host checks live in intrinsic/world/bathymetry_reference_component. See
// README.md there.
//
// An empty message serializes to zero bytes. Callers that never set this
// message keep the previous World wire image.
//
// Next tag: 5
message BathymetryReferenceComponent {
  // Required when this component is present for validation. Reuses
  // MarineComponentValidity. Host code does not fork its unknown or expired
  // rules.
  MarineComponentValidity validity = 1;

  // Exactly `world_enu` or `world_ned`. Empty and any other id are rejected.
  // `world_enu` is +Z up. `world_ned` is +Z down. This message does not
  // convert between those frames.
  string frame_id = 2;

  // Opaque URI, digest, or key for an external bathymetry artifact. This
  // string is not a grid. Empty is rejected when the component is present.
  string asset_reference = 3;

  // Meters added to the referenced surface along `frame_id` +Z. Unset means
  // absent. Zero is a supplied value. A non-finite value is rejected.
  optional double vertical_bias_m = 4;
}
