syntax = "proto3";

package intrinsic_proto.world;

import "intrinsic/world/proto/marine_component_validity.proto";

option go_package = "intrinsic/world/proto/occupancy_reference_component_go_proto";

// Referenced occupancy or free-space map for one additive World component.
//
// This message names an external artifact. It carries no inline voxels,
// occupancy samples, point clouds, or meshes.
//
// Host checks live in intrinsic/world/occupancy_reference_component. See
// README.md there.
//
// An empty message serializes to zero bytes. Callers that never set this
// message keep the previous World wire image.
//
// Next tag: 4
message OccupancyReferenceComponent {
  // Required when this component is present for validation. Reuses
  // MarineComponentValidity. Host code does not fork its unknown or expired
  // rules.
  MarineComponentValidity validity = 1;

  // Exactly `world_enu` or `world_ned`. Empty and any other id are rejected.
  // `world_enu` is +Z up. `world_ned` is +Z down. This message does not
  // convert between those frames.
  string frame_id = 2;

  // Opaque URI, digest, or key for an external occupancy or free-space
  // artifact. This string is not a grid. Empty is rejected when the
  // component is present.
  string asset_reference = 3;
}
