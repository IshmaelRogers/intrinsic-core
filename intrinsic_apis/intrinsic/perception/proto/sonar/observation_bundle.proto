syntax = "proto3";

package intrinsic_proto.perception.sonar;

import "google/protobuf/duration.proto";
import "intrinsic/embodiment/proto/stamped_header.proto";

option go_package = "intrinsic/perception/proto/sonar/observation_bundle_go_proto";

// Which observation a slot or an absent entry refers to.
// Append values. Reserve removed numbers. There is no robot-type enum.
enum ObservationModality {
  OBSERVATION_MODALITY_UNSPECIFIED = 0;
  OBSERVATION_MODALITY_SONAR_FLS = 1;
  OBSERVATION_MODALITY_SONAR_SSS = 2;
  OBSERVATION_MODALITY_OPTICAL = 3;
  OBSERVATION_MODALITY_POINT_CLOUD = 4;
  OBSERVATION_MODALITY_VEHICLE_STATE = 5;
}

// Why a modality slot is intentionally absent. UNSPECIFIED is rejected when
// an AbsentModalityEntry is present. Append values; reserve removed numbers.
enum AbsentModalityReason {
  ABSENT_MODALITY_REASON_UNSPECIFIED = 0;
  ABSENT_MODALITY_REASON_NOT_CONFIGURED = 1;
  ABSENT_MODALITY_REASON_SENSOR_OFFLINE = 2;
  ABSENT_MODALITY_REASON_OUT_OF_RANGE = 3;
  ABSENT_MODALITY_REASON_DROPPED_FOR_SKEW = 4;
  ABSENT_MODALITY_REASON_INTENTIONALLY_OMITTED = 5;
}

message AbsentModalityEntry {
  // Must not be UNSPECIFIED.
  ObservationModality modality = 1;

  // Must not be UNSPECIFIED.
  AbsentModalityReason reason = 2;
}

// One present observation slot: stamped identity plus an opaque payload
// reference. Does not embed FLS, SSS, camera, point-cloud, VehicleState, or
// World payloads.
//
// The reference fields are inlined at these locked numbers. They follow the
// same discipline as SonarPayloadBlobReference (id, optional content_type,
// optional byte_size) without importing fls_frame.proto. That message names
// the id blob_id; this slot names it reference_id. There is no third blob
// message. The host does not fetch reference_id.
//
// A slot is present iff reference_id is non-empty. The header is then
// required. google.protobuf.Timestamp is not imported here: source_time and
// receive_time live on StampedHeader, and an unused proto3 import is an error.
message ObservationSlot {
  intrinsic_proto.embodiment.StampedHeader header = 1;

  // Opaque id of the observation bytes or frame-store key.
  // Non-empty when the slot is present.
  string reference_id = 2;

  // Optional hint. May be empty.
  string content_type = 3;

  // When set: > 0.
  optional uint64 byte_size = 4;
}

// Optional latch to VehicleState and World snapshot identity.
// References only. Does not embed VehicleState or World payloads.
//
// Present iff this message is set and header.frame_id is non-empty.
// state_epoch may be 0. An empty world_snapshot_id means no World latch.
message StateReference {
  intrinsic_proto.embodiment.StampedHeader header = 1;

  // VehicleState.estimator_epoch. 0 is allowed.
  uint64 state_epoch = 2;

  // When set: 64 lowercase hex characters, the form of
  // WorldSnapshotDescriptor.snapshot_id. Empty means no World snapshot latch.
  string world_snapshot_id = 3;
}

// Approved multimodal observation bundle (non-real-time).
// Default message serializes to zero bytes (opt-in).
// Any subset of slots may be present. A fixture that claims sonar-only or
// camera-only lists every other modality in `absent` with an approved reason.
// A modality omitted from both the present slots and `absent` is a subset,
// not a defect. No model execution. No robot-type enum.
//
// max_skew is the sync window carried for fixtures and replay. Fixture
// examples use 200ms. The host does not invent that value when the field is
// unset.
message MultimodalObservationBundle {
  intrinsic_proto.embodiment.StampedHeader header = 1;

  // Required when the bundle is engaged. Duration >= 0. Nanos in range.
  google.protobuf.Duration max_skew = 2;

  ObservationSlot fls = 3;
  ObservationSlot sss = 4;
  ObservationSlot optical = 5;
  ObservationSlot point_cloud = 6;
  StateReference vehicle_state = 7;

  repeated AbsentModalityEntry absent = 8;

  // Always tolerated. The validator does not read keys or values.
  map<string, string> metadata = 100;
}
