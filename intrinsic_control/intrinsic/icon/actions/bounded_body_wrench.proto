syntax = "proto3";

package intrinsic_proto.icon.actions.proto;

import "intrinsic/vehicle/proto/vehicle_command.proto";

option go_package = "intrinsic/icon/actions/bounded_body_wrench_go_proto";

// Parameters of the `intrinsic.bounded_body_wrench` action. The same message
// is used for the fixed parameters and for the streaming input.
message BoundedBodyWrenchParams {
  // Body-frame wrench intent. Not a thruster or actuator command.
  //
  // An unset `wrench` is not a command and is rejected when the parameters are
  // parsed. A present `wrench` whose components are all zero is the neutral
  // wrench. Finiteness, frame id, validity, sequence, command age and vehicle
  // limits are checked by the vehicle part's BodyWrenchCommand, not by the
  // action.
  intrinsic_proto.vehicle.BodyWrench wrench = 1;
}
